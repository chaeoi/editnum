name: 自动发布 editnum
'on':
  push:
    branches:
    - main
  workflow_dispatch: null
concurrency:
  group: editnum-release
  cancel-in-progress: false
  queue: max
permissions:
  contents: write
jobs:
  version:
    name: 自动编号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.number.outputs.version }}
      released: ${{ steps.number.outputs.released }}
      skip: ${{ steps.number.outputs.skip }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: 计算版本并创建标签
      id: number
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        test "$GITHUB_REF" = refs/heads/main
        python3 .github/scripts/version.py
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - name: Check out repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
    - name: Derive application file version
      id: version
      shell: pwsh
      run: |
        $version = $env:VERSION
        $parts = $version.Split(".")
        $sequence = [uint32]$parts[2]
        $fileVersion = "$([int]$parts[0]), $([int]$parts[1]), $($sequence -shr 16), $($sequence -band 65535)"
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "__version__ = `"$version`"" | Out-File src/editnum/version.py -Encoding utf8
        New-Item -ItemType Directory -Force build | Out-Null
        @"
        VSVersionInfo(
          ffi=FixedFileInfo(filevers=($fileVersion), prodvers=($fileVersion), mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
          kids=[StringFileInfo([StringTable('080404b0', [
            StringStruct('CompanyName', 'EditNUM'),
            StringStruct('FileDescription', 'EditNUM PDF批量文字替换工具'),
            StringStruct('FileVersion', '$version'),
            StringStruct('InternalName', 'EditNUM'),
            StringStruct('OriginalFilename', 'EditNUM.exe'),
            StringStruct('ProductName', 'EditNUM'),
            StringStruct('ProductVersion', '$version')
          ])]), VarFileInfo([VarStruct('Translation', [2052, 1200])])]
        )
        "@ | Out-File build/version_info.txt -Encoding utf8
    - name: Install build dependencies
      run: python -m pip install -r requirements/build.txt
    - name: Cache OCR models in package
      run: python -c "from rapidocr import RapidOCR; RapidOCR(); print('OCR models ready')"
    - name: Run tests
      run: |
        ruff check src tests
        python -m pytest -q
    - name: Build portable application
      run: pyinstaller --noconfirm --clean packaging/EditNUM.spec
    - name: Smoke-test packaged executable
      shell: pwsh
      run: |
        $exe = Get-ChildItem -Path dist -Filter *.exe -Recurse | Select-Object -First 1
        if (-not $exe) { throw "Packaged executable was not found" }
        $process = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test' -Wait -PassThru
        if ($process.ExitCode -ne 0) { throw "Packaged executable self-test failed: $($process.ExitCode)" }
    - name: Create portable ZIP
      shell: pwsh
      run: |
        $licenseDir = 'dist/EditNUM/licenses'
        New-Item -ItemType Directory -Force $licenseDir | Out-Null
        Copy-Item 'docs/THIRD-PARTY-NOTICES.txt' "$licenseDir/THIRD-PARTY-NOTICES.txt"
        $pymupdfLicense = python -c "import importlib.metadata as m; print(m.distribution('PyMuPDF')._path / 'COPYING')"
        $pikepdfLicense = python -c "import importlib.metadata as m; print(m.distribution('pikepdf')._path / 'licenses' / 'LICENSE.txt')"
        Copy-Item $pymupdfLicense "$licenseDir/PyMuPDF-COPYING.txt"
        Copy-Item $pikepdfLicense "$licenseDir/pikepdf-MPL-2.0.txt"
        $zip = "EditNUM.zip"
        Compress-Archive -Path 'dist/EditNUM' -DestinationPath $zip -CompressionLevel Optimal
        (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + $zip | Out-File "$zip.sha256" -Encoding ascii
    - uses: actions/upload-artifact@v7
      with:
        name: release-windows
        path: EditNUM.zip
        if-no-files-found: error
        retention-days: 7
        overwrite: true
    needs:
    - version
    if: needs.version.outputs.skip != 'true' && needs.version.outputs.released != 'true'
    env:
      VERSION: ${{ needs.version.outputs.version }}
  release:
    name: 发布 GitHub Release
    needs:
    - version
    - build
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.skip != 'true' && (needs.build.result
      == 'success' || (needs.build.result == 'skipped' && needs.version.outputs.released == 'true')) }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRODUCT_NAME: EditNUM
      RELEASE_ASSETS: EditNUM.zip SHA256SUMS
      RELEASE_IMAGES: ''
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: 检查当前 Release 状态
      id: state
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/state.py
    - name: 下载构建产物
      if: steps.state.outputs.released != 'true'
      uses: actions/download-artifact@v7
      with:
        pattern: release-*
        merge-multiple: true
        path: dist
    - name: 生成校验和
      if: steps.state.outputs.released != 'true'
      run: |
        set -euo pipefail
        (cd dist && sha256sum * > SHA256SUMS)
    - name: 发布或恢复 Release
      id: publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 .github/scripts/publish.py
