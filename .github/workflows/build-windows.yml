name: Build PDFTextReplace Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Derive version from commit date
        id: version
        shell: pwsh
        run: |
          $commitDate = git show -s --format=%cs HEAD
          $version = $commitDate.Replace("-", "")
          $parts = $commitDate.Split("-")
          $fileVersion = "$([int]$parts[0]), $([int]$parts[1]), $([int]$parts[2]), 0"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "__version__ = `"$version`"" | Out-File src/drawing_number_tool/version.py -Encoding utf8
          New-Item -ItemType Directory -Force build | Out-Null
          @"
          VSVersionInfo(
            ffi=FixedFileInfo(filevers=($fileVersion), prodvers=($fileVersion), mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[StringFileInfo([StringTable('080404b0', [
              StringStruct('CompanyName', 'PDFTextReplace'),
              StringStruct('FileDescription', 'PDF批量文字替换工具'),
              StringStruct('FileVersion', '$version'),
              StringStruct('InternalName', 'PDFTextReplace'),
              StringStruct('OriginalFilename', 'PDFTextReplace.exe'),
              StringStruct('ProductName', 'PDF批量文字替换工具'),
              StringStruct('ProductVersion', '$version')
            ])]), VarFileInfo([VarStruct('Translation', [2052, 1200])])]
          )
          "@ | Out-File build/version_info.txt -Encoding utf8

      - name: Install build dependencies
        run: python -m pip install -r requirements/build.txt

      - name: Cache OCR models in package
        run: python -c "from rapidocr import RapidOCR; RapidOCR(); print('OCR models ready')"

      - name: Run tests
        run: |
          ruff check src tests
          python -m pytest -q

      - name: Build portable application
        run: pyinstaller --noconfirm --clean packaging/PDFTextReplace.spec

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "Packaged executable was not found" }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged executable self-test failed: $($process.ExitCode)" }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $licenseDir = 'dist/PDFTextReplace/licenses'
          New-Item -ItemType Directory -Force $licenseDir | Out-Null
          Copy-Item 'docs/THIRD-PARTY-NOTICES.txt' "$licenseDir/THIRD-PARTY-NOTICES.txt"
          $pymupdfLicense = python -c "import importlib.metadata as m; print(m.distribution('PyMuPDF')._path / 'COPYING')"
          $pikepdfLicense = python -c "import importlib.metadata as m; print(m.distribution('pikepdf')._path / 'licenses' / 'LICENSE.txt')"
          Copy-Item $pymupdfLicense "$licenseDir/PyMuPDF-COPYING.txt"
          Copy-Item $pikepdfLicense "$licenseDir/pikepdf-MPL-2.0.txt"
          $zip = "PDFTextReplace-$version-win64.zip"
          Compress-Archive -Path 'dist/PDFTextReplace' -DestinationPath $zip -CompressionLevel Optimal
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  " + $zip | Out-File "$zip.sha256" -Encoding ascii

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = $version
          $zip = "PDFTextReplace-$version-win64.zip"
          $title = "PDFTextReplace $version"
          $notes = "Windows x64 便携版。解压后运行 PDFTextReplace.exe。"
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete-asset $tag "EditNum-$version-win64.zip" --yes 2>$null
            gh release delete-asset $tag "EditNum-$version-win64.zip.sha256" --yes 2>$null
            gh release edit $tag --target $env:GITHUB_SHA --title $title --notes $notes --latest
            gh release upload $tag $zip "$zip.sha256" --clobber
          } else {
            gh release create $tag $zip "$zip.sha256" --target $env:GITHUB_SHA --title $title --notes $notes --latest
          }
