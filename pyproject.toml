[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "editnum"
dynamic = ["version"]
description = "EditNUM offline PDF text recognition and batch replacement tool"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
editnum = "editnum.cli:main"

[project.gui-scripts]
editnum-gui = "editnum.app:run"

[tool.setuptools.dynamic]
version = {attr = "editnum.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
