[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-batch-text-replacer"
dynamic = ["version"]
description = "Offline PDF text recognition and batch replacement tool"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
pdf-text-replace = "drawing_number_tool.cli:main"

[project.gui-scripts]
pdf-text-replace-gui = "drawing_number_tool.app:run"

[tool.setuptools.dynamic]
version = {attr = "drawing_number_tool.version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
